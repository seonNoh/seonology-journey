syntax = "proto3";

package journey.v1;

import "google/protobuf/timestamp.proto";
import "journey/v1/common.proto";

option go_package = "github.com/seonNoh/seonology-journey/proto/gen/go/journey/v1;journeyv1";

// === Statistics ===

message TripStatistics {
  string trip_id = 1;
  int32 total_days = 2;
  int32 total_schedules = 3;
  int32 total_meals = 4;
  Money total_expense = 5;
  double total_distance_km = 6;
  int32 total_photos = 7;
  int32 visited_regions = 8;
}
message GetTripStatisticsRequest {
  string trip_id = 1;
}
message GetTripStatisticsResponse {
  TripStatistics stats = 1;
}

message YearlyStatistics {
  int32 year = 1;
  int32 trips = 2;
  int32 days = 3;
  Money total_expense = 4;
  repeated string countries = 5;
}
message GetYearlyStatisticsRequest {
  int32 year = 1;
}
message GetYearlyStatisticsResponse {
  YearlyStatistics stats = 1;
}

// === External integrations ===

message GeocodeRequest {
  string query = 1;
}
message GeocodePlace {
  string place_id = 1;
  string name = 2;
  string address = 3;
  GeoPoint location = 4;
}
message GeocodeResponse {
  repeated GeocodePlace places = 1;
}

message ReverseGeocodeRequest {
  GeoPoint location = 1;
}
message ReverseGeocodeResponse {
  GeocodePlace place = 1;
}

message GetExchangeRateRequest {
  string base = 1; // KRW
  string target = 2; // JPY
  string date = 3; // YYYY-MM-DD (optional)
}
message GetExchangeRateResponse {
  string base = 1;
  string target = 2;
  double rate = 3;
  google.protobuf.Timestamp fetched_at = 4;
}

message GetWeatherForecastRequest {
  GeoPoint location = 1;
  string date = 2; // YYYY-MM-DD
}
message GetWeatherForecastResponse {
  string condition = 1;
  double temperature_high = 2;
  double temperature_low = 3;
  double precipitation_prob = 4;
  string raw = 5;
}
