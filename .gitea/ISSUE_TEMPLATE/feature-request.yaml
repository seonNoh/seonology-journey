name: Feature request
about: Propose a focused product or platform change
title: 'feat: '
labels: [enhancement]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [web, api, back, android, proto, deployment]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operational problem without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
