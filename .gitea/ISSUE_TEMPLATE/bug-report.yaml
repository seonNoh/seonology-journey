name: Bug report
about: Report reproducible incorrect behavior
title: 'bug: '
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [web, api, back, android, proto, deployment]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the exact error and relevant non-secret logs.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
