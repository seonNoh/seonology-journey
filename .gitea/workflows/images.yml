name: images

on:
  push:
    branches: [main]
    tags: ['api-v*', 'back-v*', 'web-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: journey-images
  cancel-in-progress: false

env:
  REGISTRY: git.seonology.com

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://gitea.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: https://gitea.com/docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: https://gitea.com/docker/setup-buildx-action@v3

      - name: Log in to Gitea Registry
        run: printf '%s' '${{ secrets.PACKAGE_TOKEN }}' | docker login "$REGISTRY" --username '${{ secrets.PACKAGE_USER }}' --password-stdin

      - name: Build, publish and verify OCI indexes serially
        env:
          REF_NAME: ${{ gitea.ref_name }}
          REF_TYPE: ${{ gitea.ref_type }}
          SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          for spec in \
            'api|apps/api/Dockerfile|git.seonology.com/seonology/seonology-journey-api|api' \
            'back|apps/back/Dockerfile|git.seonology.com/seonology/seonology-journey-back|back' \
            'web|apps/web/Dockerfile|git.seonology.com/seonology/seonology-journey-web|web'; do
            IFS='|' read -r component file image prefix <<< "$spec"
            if [[ "$REF_TYPE" == "tag" && "$REF_NAME" != "${prefix}-v"* ]]; then
              continue
            fi
            if [[ "$REF_TYPE" == "tag" ]]; then
              release_tag="$REF_NAME"
            else
              release_tag="$(git tag --list "${prefix}-v[0-9]*" --sort=-v:refname | head -n1)"
            fi
            printf '%s\n' "$release_tag" | grep -Eq "^${prefix}-v[0-9]+\.[0-9]+\.[0-9]+$"
            version="${release_tag#"${prefix}-v"}"
            short_sha="${SHA:0:7}"
            inspect_ref="$image:$version"
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --provenance=false \
              --file "$file" \
              --push \
              --tag "$inspect_ref" \
              --tag "$image:sha-$short_sha" \
              --tag "$image:latest" \
              .
            raw="$(docker buildx imagetools inspect "$inspect_ref" --raw)"
            printf '%s' "$raw" | jq -e '.manifests | any(.platform.os == "linux" and .platform.architecture == "amd64")' >/dev/null
            printf '%s' "$raw" | jq -e '.manifests | any(.platform.os == "linux" and .platform.architecture == "arm64")' >/dev/null
            printf 'published %s at %s\n' "$component" "$inspect_ref"
          done
