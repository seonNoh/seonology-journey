version: 2
updates:
  - package-ecosystem: 'gomod'
    directory: '/apps/back'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'
    labels: ['deps', 'go']

  - package-ecosystem: 'gomod'
    directory: '/apps/api'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'
    labels: ['deps', 'go']

  - package-ecosystem: 'npm'
    directory: '/apps/web'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'
    labels: ['deps', 'web']

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'
    labels: ['deps', 'root']

  - package-ecosystem: 'gradle'
    directory: '/apps/android'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'
    labels: ['deps', 'android']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(ci)'
    labels: ['deps', 'ci']

  - package-ecosystem: 'docker'
    directory: '/apps/back'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: 'docker'
    directory: '/apps/api'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: 'docker'
    directory: '/apps/web'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'
