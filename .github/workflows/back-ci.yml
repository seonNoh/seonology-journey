name: back-ci

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/back/**'
      - 'proto/**'
      - '.github/workflows/back-ci.yml'
  pull_request:
    paths:
      - 'apps/back/**'
      - 'proto/**'
      - '.github/workflows/back-ci.yml'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/seonology-journey-back

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: apps/back/go.sum
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -coverprofile=coverage.out ./...
      - name: build
        run: go build ./...

  docker:
    name: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=semver,pattern={{version}},prefix=back-v
      - uses: docker/build-push-action@v6
        with:
          context: apps/back
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=back
          cache-to: type=gha,mode=max,scope=back
