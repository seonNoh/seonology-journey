name: release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: back
            image: ghcr.io/${{ github.repository_owner }}/seonology-journey-back
            tag: back-v
          - app: api
            image: ghcr.io/${{ github.repository_owner }}/seonology-journey-api
            tag: api-v
          - app: web
            image: ghcr.io/${{ github.repository_owner }}/seonology-journey-web
            tag: web-v
          - app: android
            image: ''
            tag: android-v
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install semantic-release
        run: |
          npm init -y >/dev/null
          npm install --no-save \
            semantic-release@24 \
            @semantic-release/commit-analyzer@13 \
            @semantic-release/release-notes-generator@14 \
            @semantic-release/github@11 \
            conventional-changelog-conventionalcommits@8
      - name: run semantic-release
        id: semrel
        working-directory: apps/${{ matrix.app }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          npx --no-install semantic-release \
            --extends "$GITHUB_WORKSPACE/apps/${{ matrix.app }}/.releaserc.json" \
            > >(tee /tmp/semrel.log) 2>&1 || true
          version=$(grep -oE 'next release version is [0-9]+\.[0-9]+\.[0-9]+' /tmp/semrel.log | tail -n1 | awk '{print $NF}')
          if [ -z "$version" ]; then
            version=$(grep -oE 'Published release [0-9]+\.[0-9]+\.[0-9]+' /tmp/semrel.log | tail -n1 | awk '{print $NF}')
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "released ${{ matrix.app }} v${version}"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "no release for ${{ matrix.app }}"
          fi

      - name: tag docker image with semver
        if: steps.semrel.outputs.released == 'true' && matrix.image != ''
        id: image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          image_lc=$(echo "${{ matrix.image }}" | tr '[:upper:]' '[:lower:]')
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker buildx imagetools create \
            --tag ${image_lc}:${{ steps.semrel.outputs.version }} \
            ${image_lc}:latest
          echo "image_lc=${image_lc}" >> "$GITHUB_OUTPUT"
          echo "tagged ${image_lc}:${{ steps.semrel.outputs.version }}"

      - name: bump kustomize image tag and push
        if: >-
          steps.semrel.outputs.released == 'true' &&
          matrix.image != '' &&
          matrix.app != 'android'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_LC: ${{ steps.image.outputs.image_lc }}
          VERSION: ${{ steps.semrel.outputs.version }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          # kustomize CLI 는 runner 에 없으므로 즉석 설치. kustomize edit set
          # image 가 deploy/overlays/production/kustomization.yaml 의 해당
          # 이미지 newTag 만 치환해주므로 sed/python 으로 수동 파싱하는 것보다
          # 안전하다.
          curl -sfL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash -s -- 5.4.3
          chmod +x kustomize
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

          # 다른 매트릭스 잡이 동시에 같은 파일을 고치려 하므로 rebase-retry 루프.
          # ArgoCD 가 kustomize image 블록의 newTag 변경을 drift 로 감지해
          # automated sync 로 파드를 롤링 재배포한다.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          attempt=0
          while [ $attempt -lt 5 ]; do
            attempt=$((attempt + 1))
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            (cd deploy/overlays/production && kustomize edit set image "${IMAGE_LC}=${IMAGE_LC}:${VERSION}")

            if git diff --quiet deploy/overlays/production/kustomization.yaml; then
              echo "no kustomize change for ${APP}; skipping commit"
              exit 0
            fi

            git add deploy/overlays/production/kustomization.yaml
            git commit -m "chore(deploy): bump ${APP} image to ${VERSION} [skip ci]" --no-verify
            if git push origin main; then
              echo "pushed kustomize bump for ${APP} v${VERSION}"
              exit 0
            else
              echo "push rejected; retrying (attempt ${attempt})"
              sleep 3
            fi
          done
          echo "failed to push kustomize bump after 5 attempts" >&2
          exit 1

      - name: setup java for android
        if: steps.semrel.outputs.released == 'true' && matrix.app == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: setup gradle for android
        if: steps.semrel.outputs.released == 'true' && matrix.app == 'android'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: build android APK + AAB
        if: steps.semrel.outputs.released == 'true' && matrix.app == 'android'
        working-directory: apps/android
        env:
          ANDROID_VERSION_NAME: ${{ steps.semrel.outputs.version }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000 || true
          gradle --no-daemon assembleRelease bundleRelease
      - name: attach android artifacts to release
        if: steps.semrel.outputs.released == 'true' && matrix.app == 'android'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="android-v${{ steps.semrel.outputs.version }}"
          for f in apps/android/app/build/outputs/apk/release/*.apk apps/android/app/build/outputs/bundle/release/*.aab; do
            [ -f "$f" ] && gh release upload "$tag" "$f" --clobber
          done
