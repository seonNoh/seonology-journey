name: release

# 각 앱의 semantic-release 로 버전 태그를 찍고, Android 만 APK/AAB 를
# GitHub Release 에 첨부한다. Docker 이미지 배포는 *-ci.yml 의 docker
# job 이 main 에 push 시 :latest 를 갱신하도록 맡기고, ArgoCD Image
# Updater (argocd ns) 가 레지스트리 :latest digest 변화를 2 분 주기로
# 감지해 Application spec 을 자동 업데이트 → ArgoCD automated sync 로
# 파드가 롤링 재배포된다. 이 워크플로에서는 kustomize 를 직접 수정하지
# 않는다 (main branch protection 충돌 방지).

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: back
            tag: back-v
          - app: api
            tag: api-v
          - app: web
            tag: web-v
          - app: android
            tag: android-v
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Import Firebase secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.seonology.com
          method: jwt
          path: github-actions
          role: k3s-managed-repos
          secrets: |
            secret/data/ci/${{ github.event.repository.name }}/firebase app-id | FIREBASE_APP_ID ;
            secret/data/ci/${{ github.event.repository.name }}/firebase service-account-b64 | FB_SA_B64
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install semantic-release
        run: |
          npm init -y >/dev/null
          npm install --no-save \
            semantic-release@24 \
            @semantic-release/commit-analyzer@13 \
            @semantic-release/release-notes-generator@14 \
            @semantic-release/github@11 \
            conventional-changelog-conventionalcommits@8
      - name: run semantic-release
        id: semrel
        working-directory: apps/${{ matrix.app }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          npx --no-install semantic-release \
            --extends "$GITHUB_WORKSPACE/apps/${{ matrix.app }}/.releaserc.json" \
            > >(tee /tmp/semrel.log) 2>&1 || true
          version=$(grep -oE 'next release version is [0-9]+\.[0-9]+\.[0-9]+' /tmp/semrel.log | tail -n1 | awk '{print $NF}')
          if [ -z "$version" ]; then
            version=$(grep -oE 'Published release [0-9]+\.[0-9]+\.[0-9]+' /tmp/semrel.log | tail -n1 | awk '{print $NF}')
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "released ${{ matrix.app }} v${version}"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "no release for ${{ matrix.app }}"
          fi

      - name: setup java for android
        if: steps.semrel.outputs.released == 'true' && matrix.app == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: setup gradle for android
        if: steps.semrel.outputs.released == 'true' && matrix.app == 'android'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: build android APK + AAB
        if: steps.semrel.outputs.released == 'true' && matrix.app == 'android'
        working-directory: apps/android
        env:
          ANDROID_VERSION_NAME: ${{ steps.semrel.outputs.version }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000 || true
          gradle --no-daemon assembleRelease bundleRelease
      - name: attach android artifacts to release
        if: steps.semrel.outputs.released == 'true' && matrix.app == 'android'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="android-v${{ steps.semrel.outputs.version }}"
          for f in apps/android/app/build/outputs/apk/release/*.apk apps/android/app/build/outputs/bundle/release/*.aab; do
            [ -f "$f" ] && gh release upload "$tag" "$f" --clobber
          done

      # Firebase App Distribution: 테스터 그룹 internal 에 APK 배포.
      # FIREBASE_APP_ID / FIREBASE_SERVICE_ACCOUNT_KEY 시크릿이 없으면
      # 액션이 빈 문자열을 받아 실패한다. continue-on-error 로 감싸서
      # 릴리즈 전체가 깨지는 걸 막는다 (APK 는 이미 GitHub Release 에
      # 첨부된 상태이므로 이 스텝 실패는 치명적이지 않다).
      - name: Decode Firebase service account
        if: steps.semrel.outputs.released == 'true' && matrix.app == 'android'
        run: printf '%s' "${FB_SA_B64}" | base64 -d > "${RUNNER_TEMP}/fb-sa.json"
      - name: upload apk to Firebase App Distribution
        if: steps.semrel.outputs.released == 'true' && matrix.app == 'android'
        continue-on-error: true
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.FIREBASE_APP_ID }}
          serviceCredentialsFile: ${{ runner.temp }}/fb-sa.json
          groups: internal
          file: apps/android/app/build/outputs/apk/release/app-release.apk
          releaseNotes: |
            android-v${{ steps.semrel.outputs.version }}
            ${{ github.event.head_commit.message }}
