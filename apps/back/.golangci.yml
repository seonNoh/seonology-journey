version: '2'

run:
  timeout: 5m
  tests: false

formatters:
  enable:
    - gofmt
    - goimports

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
  settings:
    errcheck:
      check-type-assertions: false
      exclude-functions:
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
    staticcheck:
      checks:
        - 'all'
        - '-SA1019'
        - '-ST1003'

issues:
  exclude-dirs:
    - vendor
  max-issues-per-linter: 0
  max-same-issues: 0
