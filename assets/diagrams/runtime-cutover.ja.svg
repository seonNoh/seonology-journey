<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="g65-runtime-cutover-ja-title g65-runtime-cutover-ja-desc">
