apiVersion: v1
kind: ServiceAccount
metadata:
  name: seonology-journey-back
  namespace: seonology-journey
  annotations:
    vault.hashicorp.com/role: seonology-journey-back
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seonology-journey-back
  namespace: seonology-journey
  labels:
    app.kubernetes.io/name: seonology-journey-back
    app.kubernetes.io/part-of: seonology-journey
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: seonology-journey-back
      app.kubernetes.io/part-of: seonology-journey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seonology-journey-back
        app.kubernetes.io/part-of: seonology-journey
      annotations:
        # Vault Agent injection は secret 登録後に有効化する.
        # vault.hashicorp.com/agent-inject: "true"
        # vault.hashicorp.com/role: "seonology-journey-back"
    spec:
      serviceAccountName: seonology-journey-back
      # 같은 노드에 2 replica 쌓이는 것 방지. ip-172-26-2-70 워커가 CPU
      # requests 98%에 도달해 있어, 같은 노드에 둘 다 스케줄되면 한쪽이
      # throttling으로 probe timeout 나는 사고가 있었음.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: seonology-journey-back
              app.kubernetes.io/part-of: seonology-journey
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: back
          image: ghcr.io/seonnoh/seonology-journey-back:latest
          imagePullPolicy: Always
          ports:
            - name: grpc
              containerPort: 9090
            - name: metrics
              containerPort: 9091
          env:
            - name: GRPC_LISTEN_ADDR
              value: ':9090'
            - name: METRICS_LISTEN_ADDR
              value: ':9091'
            - name: DDB_TABLE_PREFIX
              value: 'seonology-journey-'
            - name: S3_MEDIA_BUCKET
              value: 'seonology-journey-media'
            - name: AUTH_BACK_GRPC_ADDR
              value: 'seonology-auth-back.seonology-common.svc.cluster.local:9090'
            - name: MEMBER_BACK_GRPC_ADDR
              value: 'seonology-member-back.seonology-common.svc.cluster.local:9090'
          envFrom: []
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
          livenessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 20
            # gRPC probe 기본 timeout은 1s. CPU가 빠듯한 노드에서 Go GC 일시 정지
            # 시 1s 초과해 false-negative로 컨테이너가 무한 재시작하는 사고가
            # 있어 3s로 늘림. failureThreshold 3은 명시.
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
