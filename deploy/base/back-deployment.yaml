apiVersion: v1
kind: ServiceAccount
metadata:
  name: seonology-journey-back
  namespace: seonology-journey
  annotations:
    vault.hashicorp.com/role: seonology-journey-back
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seonology-journey-back
  namespace: seonology-journey
  labels:
    app.kubernetes.io/name: seonology-journey-back
    app.kubernetes.io/part-of: seonology-journey
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: seonology-journey-back
      app.kubernetes.io/part-of: seonology-journey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seonology-journey-back
        app.kubernetes.io/part-of: seonology-journey
      annotations:
        # Vault Agent injection は secret 登録後に有効化する.
        # vault.hashicorp.com/agent-inject: "true"
        # vault.hashicorp.com/role: "seonology-journey-back"
    spec:
      serviceAccountName: seonology-journey-back
      # 같은 노드에 2 replica 쌓이는 것 방지. ip-172-26-2-70 워커가 CPU
      # requests 98%에 도달해 있어, 같은 노드에 둘 다 스케줄되면 한쪽이
      # throttling으로 probe timeout 나는 사고가 있었음.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: seonology-journey-back
              app.kubernetes.io/part-of: seonology-journey
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: back
          image: ghcr.io/seonnoh/seonology-journey-back:latest
          imagePullPolicy: Always
          ports:
            - name: grpc
              containerPort: 9090
            - name: metrics
              containerPort: 9091
          env:
            - name: GRPC_LISTEN_ADDR
              value: ':9090'
            - name: METRICS_LISTEN_ADDR
              value: ':9091'
            - name: DDB_TABLE_PREFIX
              value: 'seonology-journey-'
            - name: S3_MEDIA_BUCKET
              value: 'seonology-journey-media'
            - name: AUTH_BACK_GRPC_ADDR
              value: 'seonology-auth-back.seonology-common.svc.cluster.local:9090'
            - name: MEMBER_BACK_GRPC_ADDR
              value: 'seonology-member-back.seonology-common.svc.cluster.local:9090'
            # OpenTelemetry (traces -> OTel Collector -> Tempo)
            - name: OTEL_SERVICE_NAME
              value: 'seonology-journey-back'
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: 'http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317'
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: 'grpc'
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: 'deployment.environment=production,k8s.namespace.name=seonology-journey'
            - name: OTEL_TRACES_SAMPLER
              value: 'parentbased_traceidratio'
            - name: OTEL_TRACES_SAMPLER_ARG
              value: '1.0'
          envFrom: []
          resources:
            requests:
              # 100m이었을 때 lightsail worker(CPU requests 98%) 슬롯에 끼어들어
              # throttling 받으며 startup 동안 probe timeout 누적. 200m으로 올려
              # 충분히 압박 적은 노드로 스케줄되도록 함.
              cpu: '200m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
          startupProbe:
            # gRPC 서버가 의존 서비스(auth-back, member-back) 연결과 AWS SDK
            # 초기화를 끝낼 때까지의 grace. 5s × 12 = 최대 60s. 그 안에 한 번이라도
            # 성공하면 liveness/readiness로 전환.
            grpc:
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 20
            # gRPC probe 기본 timeout은 1s. CPU가 빠듯한 노드에서 Go GC 일시 정지
            # 시 1s 초과해 false-negative로 컨테이너가 무한 재시작하는 사고가
            # 있어 3s로 늘림. failureThreshold 3은 명시.
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
