apiVersion: v1
kind: ServiceAccount
metadata:
  name: seonology-journey-back
  namespace: seonology-journey
  annotations:
    vault.hashicorp.com/role: seonology-journey-back
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seonology-journey-back
  namespace: seonology-journey
  labels:
    app.kubernetes.io/name: seonology-journey-back
    app.kubernetes.io/part-of: seonology-journey
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: seonology-journey-back
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seonology-journey-back
        app.kubernetes.io/part-of: seonology-journey
      annotations:
        vault.hashicorp.com/agent-inject: 'true'
        vault.hashicorp.com/role: 'seonology-journey-back'
        vault.hashicorp.com/agent-inject-secret-aws.env: 'secret/data/seonology-journey/aws'
        vault.hashicorp.com/agent-inject-template-aws.env: |
          {{- with secret "secret/data/seonology-journey/aws" -}}
          AWS_ACCESS_KEY_ID={{ .Data.data.access_key_id }}
          AWS_SECRET_ACCESS_KEY={{ .Data.data.secret_access_key }}
          AWS_REGION=ap-northeast-1
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-google.env: 'secret/data/seonology-journey/google'
        vault.hashicorp.com/agent-inject-template-google.env: |
          {{- with secret "secret/data/seonology-journey/google" -}}
          GOOGLE_MAPS_API_KEY={{ .Data.data.maps_api_key }}
          GOOGLE_PLACES_API_KEY={{ .Data.data.places_api_key }}
          {{- end }}
    spec:
      serviceAccountName: seonology-journey-back
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: back
          image: ghcr.io/seonnoh/seonology-journey-back:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 9090
            - name: metrics
              containerPort: 9091
          env:
            - name: GRPC_LISTEN_ADDR
              value: ':9090'
            - name: METRICS_LISTEN_ADDR
              value: ':9091'
            - name: DDB_TABLE_PREFIX
              value: 'seonology-journey-'
            - name: S3_MEDIA_BUCKET
              value: 'seonology-journey-media'
            - name: AUTH_BACK_GRPC_ADDR
              value: 'seonology-auth-back.seonology-common.svc.cluster.local:9090'
            - name: MEMBER_BACK_GRPC_ADDR
              value: 'seonology-member-back.seonology-common.svc.cluster.local:9090'
          envFrom: []
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
          livenessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
