apiVersion: v1
kind: ServiceAccount
metadata:
  name: seonology-journey-back
  namespace: seonology-journey
  annotations:
    vault.hashicorp.com/role: seonology-journey-back
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seonology-journey-back
  namespace: seonology-journey
  labels:
    app.kubernetes.io/name: seonology-journey-back
    app.kubernetes.io/part-of: seonology-journey
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: seonology-journey-back
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seonology-journey-back
        app.kubernetes.io/part-of: seonology-journey
      annotations:
        # Vault Agent injection は secret 登録後に有効化する.
        # vault.hashicorp.com/agent-inject: "true"
        # vault.hashicorp.com/role: "seonology-journey-back"
    spec:
      serviceAccountName: seonology-journey-back
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: back
          image: ghcr.io/seonnoh/seonology-journey-back:latest
          imagePullPolicy: Always
          ports:
            - name: grpc
              containerPort: 9090
            - name: metrics
              containerPort: 9091
          env:
            - name: GRPC_LISTEN_ADDR
              value: ':9090'
            - name: METRICS_LISTEN_ADDR
              value: ':9091'
            - name: DDB_TABLE_PREFIX
              value: 'seonology-journey-'
            - name: S3_MEDIA_BUCKET
              value: 'seonology-journey-media'
            - name: AUTH_BACK_GRPC_ADDR
              value: 'seonology-auth-back.seonology-common.svc.cluster.local:9090'
            - name: MEMBER_BACK_GRPC_ADDR
              value: 'seonology-member-back.seonology-common.svc.cluster.local:9090'
          envFrom: []
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
          livenessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
