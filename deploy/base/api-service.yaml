apiVersion: v1
kind: Service
metadata:
  name: seonology-journey-api
  namespace: seonology-journey
  labels:
    app.kubernetes.io/name: seonology-journey-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: seonology-journey-api
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 8081
      targetPort: metrics
