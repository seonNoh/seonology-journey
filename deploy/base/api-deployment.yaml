apiVersion: v1
kind: ServiceAccount
metadata:
  name: seonology-journey-api
  namespace: seonology-journey
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seonology-journey-api
  namespace: seonology-journey
  labels:
    app.kubernetes.io/name: seonology-journey-api
    app.kubernetes.io/part-of: seonology-journey
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: seonology-journey-api
      app.kubernetes.io/part-of: seonology-journey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seonology-journey-api
        app.kubernetes.io/part-of: seonology-journey
      annotations:
        # Vault Agent injection は secret 登録後に有効化する.
        # vault.hashicorp.com/agent-inject: "true"
        # vault.hashicorp.com/role: "seonology-journey-api"
    spec:
      serviceAccountName: seonology-journey-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/seonnoh/seonology-journey-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          env:
            - name: HTTP_LISTEN_ADDR
              value: ':8080'
            - name: METRICS_LISTEN_ADDR
              value: ':8081'
            - name: BACK_GRPC_ADDR
              value: 'seonology-journey-back.seonology-journey.svc.cluster.local:9090'
            - name: ALLOWED_ORIGINS
              value: 'https://journey.seonology.com'
            - name: CORS_ALLOW_ORIGIN
              value: 'https://journey.seonology.com'
            - name: KEYCLOAK_JWKS_URL
              value: 'https://auth.seonology.com/realms/seonology-journey/protocol/openid-connect/certs'
            - name: KEYCLOAK_ISSUER
              value: 'https://auth.seonology.com/realms/seonology-journey'
            - name: KEYCLOAK_AUDIENCE
              value: 'seonology-journey'
            # OpenTelemetry (traces -> OTel Collector -> Tempo)
            - name: OTEL_SERVICE_NAME
              value: 'seonology-journey-api'
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: 'http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317'
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: 'grpc'
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: 'deployment.environment=production,k8s.namespace.name=seonology-journey'
            - name: OTEL_TRACES_SAMPLER
              value: 'parentbased_traceidratio'
            - name: OTEL_TRACES_SAMPLER_ARG
              value: '1.0' # 시범 100%, 검증 후 0.1~0.2 로 축소
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
