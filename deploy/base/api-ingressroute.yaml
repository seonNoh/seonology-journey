apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: journey-api-seonology-com-tls
  namespace: seonology-journey
spec:
  secretName: journey-api-seonology-com-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - journey-api.seonology.com
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-cors
  namespace: seonology-journey
spec:
  headers:
    accessControlAllowOriginList:
      - https://journey.seonology.com
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    accessControlAllowHeaders:
      - Authorization
      - Content-Type
      - X-Request-Id
    accessControlAllowCredentials: true
    accessControlMaxAge: 600
    addVaryHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ws-timeout
  namespace: seonology-journey
spec:
  inFlightReq:
    amount: 200
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: seonology-journey-api-https
  namespace: seonology-journey
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`journey-api.seonology.com`) && PathPrefix(`/ws/`)
      kind: Rule
      services:
        - name: seonology-journey-api
          port: 8080
      middlewares:
        - name: api-cors
        - name: ws-timeout
    - match: Host(`journey-api.seonology.com`) && !PathPrefix(`/ws/`)
      kind: Rule
      services:
        - name: seonology-journey-api
          port: 8080
      middlewares:
        - name: api-cors
  tls:
    secretName: journey-api-seonology-com-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: seonology-journey-api-http
  namespace: seonology-journey
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`journey-api.seonology.com`)
      kind: Rule
      services:
        - name: seonology-journey-api
          port: 8080
      middlewares:
        - name: redirect-to-https
